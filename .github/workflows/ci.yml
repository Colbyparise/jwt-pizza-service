name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword" --health-interval 10s --health-start-period 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Write config file
        run: |
          echo "module.exports = {
            jwtSecret: '${{ secrets.JWT_SECRET }}',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: '${{ secrets.FACTORY_API_KEY }}',
            },
            metrics: {
              source: 'jwt-pizza-service',
              endpointURL: '${{ secrets.METRICS_ENDPOINT_URL }}',
              accountId: '${{ secrets.METRICS_ACCOUNT_ID }}',
              apiKey: '${{ secrets.METRICS_API_KEY }}',
            },
            logging: {
              source: 'jwt-pizza-service',
              endpointUrl: '${{ secrets.LOGGING_ENDPOINT_URL }}',
              accountId: '${{ secrets.LOGGING_ACCOUNT_ID }}',
              apiKey: '${{ secrets.LOGGING_API_KEY }}',
            },
          };" > src/config.js

      - name: Tests
        env:
          NODE_ENV: test
        run: npm test -- --coverage

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > src/version.json

      - name: Update coverage
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
          curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzaservicecoverage?label=Coverage&value=$coverage%25&color=$color" -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"

      - name: Create dist
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
        run: |
          for name in DB_USERNAME DB_PASSWORD DB_HOSTNAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          if [[ "$DB_HOSTNAME" == "127.0.0.1" || "$DB_HOSTNAME" == "localhost" ]]; then
            echo "::error::DB_HOSTNAME must point to the production database"
            exit 1
          fi

          mkdir dist
          cp Dockerfile dist/
          cp -r src/* dist/
          cp *.json dist/

          node <<'NODE'
          const fs = require('node:fs');
          const config = require('./dist/config.js');
          Object.assign(config.db.connection, {
            user: process.env.DB_USERNAME,
            password: process.env.DB_PASSWORD,
            host: process.env.DB_HOSTNAME,
          });
          fs.writeFileSync('dist/config.js', `module.exports = ${JSON.stringify(config, null, 2)};\n`);
          NODE
          node --check dist/config.js

      - name: Update distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/

  deploy:
    name: Deploy image to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: build
    env:
      version: ${{ needs.build.outputs.version }}

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up machine emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: jwt-pizza-service
        run: |
          docker build --platform=linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$version" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy new container
        run: aws ecs update-service --cluster jwt-pizza-service --service jwt-pizza-service-service-pfg6ws5w --force-new-deployment --region us-east-1

      - name: Verify deployed service and database
        env:
          SERVICE_URL: https://pizza-service.colbypizza.click
        run: |
          for attempt in {1..40}; do
            deployed_version=$(curl -fsS --connect-timeout 5 --max-time 10 "$SERVICE_URL/" | jq -er '.version') || deployed_version=''
            if [[ "$deployed_version" == "$version" ]]; then
              if ! curl -fsS --connect-timeout 5 --max-time 75 -o /dev/null "$SERVICE_URL/api/order/menu"; then
                echo "::error::The new service is running, but its database-backed menu failed. Check the RDS admin credentials and DB_HOSTNAME/DB_USERNAME/DB_PASSWORD repository secrets."
                exit 1
              fi
              echo "The new service and its production database connection are working."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the new service version $version."
          exit 1
